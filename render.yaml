databases:
  - name: memory-app-db
    databaseName: memory_app_production
    user: memory_user
    plan: free

services:
  - type: web
    name: memory-app
    env: ruby
    buildCommand: "./bin/render-build.sh"
    preDeployCommand: "bundle exec rake db:migrate"
    startCommand: "bundle exec puma -C config/puma.rb"
    envVars:
      - key: RAILS_MASTER_KEY
        sync: false
